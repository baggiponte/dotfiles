[diagnostics]
enabled = true
sql_linter = true

[display]
cell_output = "below"
code_editor_font_size = 14
dataframes = "rich"
default_table_max_columns = 50
default_table_page_size = 50
default_width = "full"
reference_highlighting = true
theme = "light"

[experimental]
chat_sidebar = true
external_agents = true
multi_column = true
tracing = true

[formatting]
line_length = 79

[keymap]
destructive_delete = true
preset = "vim"

[keymap.overrides]

[language_servers.basedpyright]
enabled = false

[language_servers.pylsp]
enable_flake8 = false
enable_mypy = false
enable_pydocstyle = false
enable_pyflakes = false
enable_pylint = false
enable_ruff = false
enabled = false

[language_servers.pyrefly]
enabled = true

[language_servers.ty]
enabled = true

[mcp]
presets = []

[mcp.mcpServers]

[package_management]
manager = "uv"

[runtime]
auto_instantiate = true
auto_reload = "autorun"
default_auto_download = []
default_csv_encoding = "utf-8"
default_sql_output = "native"
dotenv = []
on_cell_change = "autorun"
output_max_bytes = 8000000
reactive_tests = true
show_tracebacks = false
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[server]
browser = "default"
follow_symlink = false

[snippets]
custom_paths = []
include_default_snippets = true
