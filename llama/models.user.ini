; Custom settings for your models, applied on top of the ones the app picks.
; The app regenerates its own config from a scan of your model cache every
; launch. This file is yours -- the app only ever reads it, so your edits
; survive. Anything you set here wins.

; ============================================================================
; superwhisper/s1-mini  (transcript post-processor)
; ============================================================================
; Forces the exact S1-mini chat template (system prompt baked in + empty
; thinking block) and greedy decoding, regardless of what the GGUF metadata
; defaults to. The chat-template-file path below is the file written by this
; config update; ripgrep: "s1-mini-chat-template.jinja".
;
; temp = 0 is required: the GGUF ships Qwen3 sampling defaults (temp 0.6,
; top_p 0.95, top_k 20) which are wrong for this deterministic normalizer.
[superwhisper/s1-mini-GGUF:Q4_K_M]
chat-template-file = /Users/baggiponte/.config/llama/s1-mini-chat-template.jinja
temp = 0
