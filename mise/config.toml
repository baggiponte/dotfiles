[tools]
bun = "latest"
node = "latest"
pnpm = "latest"
# Cloudflare currently publishes its latest CLI as a prerelease.
"npm:cf" = { version = "latest" }
"npm:skills" = "latest"
hunk = "latest"
go = "latest"

[settings]
experimental = true
npm.package_manager = "pnpm"
tool_update.global_auto = true

[settings.self_update]
auto = true
